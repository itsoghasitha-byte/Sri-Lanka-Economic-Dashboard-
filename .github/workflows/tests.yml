name: Automated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py data_utils.py api tests
      - name: Check frontend JavaScript syntax
        run: node --check script.js && node --check api-client.js && node --check public/script.js && node --check public/api-client.js
      - name: Validate Vercel configuration and frontend assets
        run: |
          python -c "import json; json.load(open('vercel.json'))"
          test -f index.py
          test -f public/index.html
          test -f public/styles.css
          test -f public/script.js
          test -f public/api-client.js
      - name: Smoke-test FastAPI import
        env:
          PYTHONPATH: .
        run: python -c "from api.main import app; assert app.title; print(app.title)"
      - name: Run unit, API and Streamlit app tests
        env:
          PYTHONPATH: .
        run: pytest -q -ra
