<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sri Lanka Economic Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0d12;--panel:rgba(11,13,18,.8);--line:rgba(255,255,255,.14);--text:#eef0f4;--mute:#a6adbb;--gold:#f4b73a;--up:#6fd36b;--down:#ee5a5f;--cmp:#59b7ff;--head:'Oswald','Arial Narrow',Impact,sans-serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font:14px/1.45 var(--body);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#gl:active{cursor:grabbing}
.title{position:fixed;left:max(20px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));pointer-events:none;text-shadow:0 2px 18px #000}
h1{font:700 clamp(28px,5vw,54px)/.95 var(--head);margin:0;letter-spacing:.01em;text-transform:uppercase}
.note{max-width:34ch;margin:10px 0 0;color:var(--gold);font-size:12px}
.panel{position:fixed;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));width:350px;max-height:calc(100% - 32px);overflow:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-left:3px solid var(--gold);padding:14px 16px;display:grid;gap:12px}
label{display:grid;gap:4px;color:var(--mute);font-size:12px}
select,input[type=range],button{font:inherit;color:var(--text)}
select{background:#161a23;border:1px solid var(--line);padding:7px 8px}
.years{display:flex;gap:4px;flex-wrap:wrap}
.years button,#csv{background:#161a23;border:1px solid var(--line);padding:5px 8px;cursor:pointer}
.years button[aria-pressed=true]{background:var(--gold);color:#111;border-color:var(--gold);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cmp);outline-offset:2px}
.kpi{display:flex;align-items:baseline;gap:12px}.kpi b{font:700 38px/1 var(--head)}.kpi span{font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}
svg{width:100%;height:auto;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.brief{margin:0;font-size:13px;border-left:3px solid var(--gold);padding-left:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px}
#tip{position:fixed;pointer-events:none;background:#000c;border:1px solid var(--gold);padding:5px 9px;font-size:12px;transform:translate(12px,12px)}
#nogl{display:none;position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#3a2a12,#0b0d12 70%)}
.nogl #nogl{display:block}.nogl #gl{display:none}
@media(max-width:760px){.panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:55%;border-left:0;border-top:3px solid var(--gold)}.title{top:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mut{color:var(--mute);font-size:12px}
</style>
</head>
<body>
<div id="nogl"></div>
<canvas id="gl" role="img" aria-label="3D Colombo skyline with the Nelum Kuluna tower and one tower per year for the chosen indicator. Drag to orbit, scroll to zoom."></canvas>
<header class="title"><h1>Sri Lanka<br>Economic Dashboard</h1><p class="note" id="note"></p></header>
<section class="panel" aria-label="Controls and chart">
  <label>Indicator<select id="ind"></select></label>
  <label>Compare with<select id="cmp"></select></label>
  <div class="years" id="years" role="group" aria-label="Year"></div>
  <div class="kpi"><b id="val"></b><span id="yoy"></span></div>
  <svg id="chart" viewBox="0 0 320 150" role="img" aria-label="Trend chart"></svg>
  <div class="legend" id="legend"></div>
  <p class="brief" id="brief"></p>
  <label>Time of day<input id="tod" type="range" min="0" max="1" step="0.005"></label>
  <div class="row2"><label style="display:flex;flex-direction:row;gap:6px;align-items:center"><input id="fc" type="checkbox"> Forecast 2025 to 2026</label><label>Quality<select id="q"><option value="1">Low</option><option value="2" selected>Medium</option><option value="4">High</option></select></label></div>
  <div class="row2"><button id="tour" type="button">Start cinematic tour</button><span id="perf" class="mut" aria-live="off"></span></div>
  <button id="csv" type="button">Download data (CSV)</button>
</section>
<div id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/* ---------- Data layer (illustrative: swap for verified CBSL / DCS series) ---------- */
const YEARS = [2018,2019,2020,2021,2022,2023,2024];
const IND = [
 {id:'gdp',  label:'Real GDP growth',      unit:'%',      good:'up',   v:[3.3,2.3,-3.5,3.3,-7.3,-2.3,5.0]},
 {id:'cpi',  label:'Inflation (annual avg)',unit:'%',      good:'down', v:[4.3,4.3,4.6,6.0,46.4,17.4,1.2]},
 {id:'unemp',label:'Unemployment rate',    unit:'%',      good:'down', v:[4.4,4.8,5.5,5.1,4.7,4.7,4.3]},
 {id:'exp',  label:'Merchandise exports',  unit:' USD bn',good:'up',   v:[11.9,11.9,10.0,12.5,13.1,11.9,12.7]},
 {id:'tour', label:'Tourist arrivals',     unit:' m',     good:'up',   v:[2.33,1.91,0.51,0.19,0.72,1.49,2.05]},
 {id:'rem',  label:'Worker remittances',   unit:' USD bn',good:'up',   v:[7.0,6.7,7.1,5.5,3.8,6.0,6.5]}
];
const byId = id => IND.find(i => i.id === id);
const ext = a => [Math.min(...a), Math.max(...a)];
const fmt = (v,u) => `${v<0?'\u2212':''}${Math.abs(v).toFixed(Math.abs(v)<10?1:1)}${u}`;
const pearson = (a,b) => { const n=a.length, ma=a.reduce((s,x)=>s+x,0)/n, mb=b.reduce((s,x)=>s+x,0)/n;
  let c=0,va=0,vb=0; for(let i=0;i<n;i++){c+=(a[i]-ma)*(b[i]-mb);va+=(a[i]-ma)**2;vb+=(b[i]-mb)**2;} return c/Math.sqrt(va*vb); };
console.assert(Math.abs(pearson([1,2,3],[2,4,6])-1)<1e-9,'pearson self-test failed');
/* Ordinary least squares on the last 5 points, with a residual-based band */
function forecast(v,k=2){const m=v.slice(-5),n=m.length,mx=(n-1)/2,my=m.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0;
 m.forEach((y,i)=>{sxy+=(i-mx)*(y-my);sxx+=(i-mx)**2;});const b=sxy/sxx,a=my-b*mx,sd=Math.sqrt(m.reduce((s,y,i)=>s+(y-(a+b*i))**2,0)/Math.max(1,n-2));
 return {pts:[...Array(k)].map((_,j)=>a+b*(n+j)),sd};}
console.assert(Math.abs(forecast([1,2,3,4,5]).pts[0]-6)<1e-9,'forecast self-test failed');
const thr=a=>{const[lo,h]=ext(a.v);return lo+(h-lo)*.6;};
const KF=[{th:.35,ph:1.2,rad:52,y:9},{th:-.7,ph:1.0,rad:34,y:15},{th:.95,ph:.78,rad:72,y:22},{th:2.3,ph:1.15,rad:40,y:8}];
let fpsAcc=0,fpsN=0;function perf(dt){fpsAcc+=dt;fpsN++;if(fpsAcc>.5){$('#perf').textContent=`${Math.round(fpsN/fpsAcc)} fps, ${world.r.info.render.calls} draw calls`;fpsAcc=0;fpsN=0;}}

/* ---------- Tiny observable store ---------- */
class Store{constructor(s){this.s=s;this.l=new Set();}get(){return this.s;}
  set(p){this.s={...this.s,...p};this.l.forEach(f=>f(this.s));}sub(f){this.l.add(f);f(this.s);}}
let saved = {}; try{saved = JSON.parse(localStorage.getItem('sled')||'{}');}catch(e){}
const store = new Store({ind:'gdp',cmp:'',yi:6,tod:0.72,...saved});
store.sub(s => { try{localStorage.setItem('sled',JSON.stringify(s));}catch(e){} });

const $ = s => document.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t;
const mixC=(a,b,t)=>new THREE.Color(a).lerp(new THREE.Color(b),clamp(t,0,1));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 3D world: real-time shadows, fog, day/night cycle ---------- */
class World{
 constructor(canvas,onPick,onHover){
  try{ this.r = new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
  catch(e){ this.ok=false; return; }
  this.ok=true; this.onPick=onPick; this.onHover=onHover; this.canvas=canvas;
  const r=this.r; r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
  r.outputEncoding=THREE.sRGBEncoding; r.toneMapping=THREE.ACESFilmicToneMapping;
  this.scene=new THREE.Scene(); this.scene.fog=new THREE.Fog(0x000000,70,260);
  this.cam=new THREE.PerspectiveCamera(46,1,.5,600);
  this.o={th:.35,ph:1.2,rad:52,tgt:new THREE.Vector3(0,9,-4),idle:0};
  this.towers=[]; this.ray=new THREE.Raycaster(); this.m=new THREE.Vector2();
  this.buildLights(); this.buildGround(); this.buildCity(); this.buildLotusTower(); this.buildTraffic();
  this.bindInput(); this.resize(); addEventListener('resize',()=>this.resize());
 }
 buildLights(){
  this.hemi=new THREE.HemisphereLight(0xbcd2ff,0x2a1d12,.4); this.scene.add(this.hemi);
  const s=this.sun=new THREE.DirectionalLight(0xffffff,1.5); s.castShadow=true;
  s.shadow.mapSize.set(2048,2048); const c=s.shadow.camera; c.left=-70;c.right=70;c.top=70;c.bottom=-70;c.near=1;c.far=260;
  s.shadow.bias=-.0004; s.shadow.normalBias=.03; this.scene.add(s,s.target);
 }
 buildGround(){
  const g=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x2a2c33,roughness:.95}));
  g.rotation.x=-Math.PI/2; g.receiveShadow=true; this.scene.add(g);
  const sea=new THREE.Mesh(new THREE.PlaneGeometry(500,200),new THREE.MeshStandardMaterial({color:0x0f3e63,roughness:.25,metalness:.4}));
  sea.rotation.x=-Math.PI/2; sea.position.set(0,.02,160); sea.receiveShadow=true; this.scene.add(sea);
  const dash=new THREE.InstancedMesh(new THREE.BoxGeometry(.4,.04,3),new THREE.MeshStandardMaterial({color:0xf2d36b}),40);
  const d=new THREE.Object3D(); for(let i=0;i<40;i++){d.position.set(0,.03,-90+i*6);d.updateMatrix();dash.setMatrixAt(i,d.matrix);}
  dash.receiveShadow=true; this.scene.add(dash);
 }
 windowTexture(){
  const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,64,64);
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){ if(Math.random()>.45){x.fillStyle=Math.random()>.7?'#ffd98a':'#ffeccc';x.fillRect(i*8+2,j*8+2,4,5);} }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
 }
 buildCity(){
  const N=320, geo=new THREE.BoxGeometry(1,1,1); geo.translate(0,.5,0);
  this.cityMat=new THREE.MeshStandardMaterial({color:0x8f94a3,roughness:.7,metalness:.1,emissive:0xffffff,emissiveMap:this.windowTexture(),emissiveIntensity:0});
  const m=new THREE.InstancedMesh(geo,this.cityMat,N); m.castShadow=m.receiveShadow=true;
  const d=new THREE.Object3D(), col=new THREE.Color(); let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<N;i++){
   let x,z; do{ x=(rnd()-.5)*190; z=-14-rnd()*80; }while(Math.abs(x)<9&&z>-26);
   const w=3+rnd()*5, h=4+Math.pow(rnd(),2.2)*34;
   d.position.set(Math.round(x/8)*8,0,Math.round(z/8)*8); d.scale.set(w,h,3+rnd()*5); d.updateMatrix(); m.setMatrixAt(i,d.matrix);
   m.setColorAt(i,col.setHSL(.58+rnd()*.06,.08+rnd()*.1,.32+rnd()*.3));
  }
  this.scene.add(m);
 }
 buildLotusTower(){
  const g=new THREE.Group(), mat=new THREE.MeshStandardMaterial({color:0xe9d9e6,roughness:.45,metalness:.35,emissive:0xff4fa0,emissiveIntensity:0});
  const add=(geo,y)=>{const m=new THREE.Mesh(geo,mat);m.position.y=y;m.castShadow=m.receiveShadow=true;g.add(m);return m;};
  add(new THREE.CylinderGeometry(3.6,4.4,2,32),1);
  add(new THREE.CylinderGeometry(.8,1.4,28,24),15);
  const bulb=add(new THREE.SphereGeometry(3.2,32,24),31); bulb.scale.y=1.35;
  for(let i=0;i<12;i++){ const p=new THREE.Mesh(new THREE.ConeGeometry(1.1,5,10),mat); const a=i/12*Math.PI*2;
    p.position.set(Math.cos(a)*2.2,34.4,Math.sin(a)*2.2); p.rotation.set(Math.sin(a)*.35,0,-Math.cos(a)*.35); p.castShadow=true; g.add(p); }
  add(new THREE.CylinderGeometry(.12,.3,9,10),41.5);
  this.beacon=new THREE.Mesh(new THREE.SphereGeometry(.4,12,12),new THREE.MeshBasicMaterial({color:0xff2a2a})); this.beacon.position.y=46.2; g.add(this.beacon);
  g.position.set(0,0,-18); this.scene.add(g); this.lotusMat=mat;
 }
 buildTraffic(){
  const N=56; this.cars=new THREE.InstancedMesh(new THREE.BoxGeometry(1.1,.7,2.3),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xff3a2a,emissiveIntensity:.5}),N); this.cars.castShadow=true;
  this.carData=[...Array(N)].map((_,i)=>({x:i%2?2.2:-2.2,z:-10+Math.random()*150,v:(i%2?1:-1)*(8+Math.random()*9)}));
  const col=new THREE.Color(); this.carData.forEach((c,i)=>this.cars.setColorAt(i,col.setHSL(Math.random(),.6,.55))); this.scene.add(this.cars); this.cd=new THREE.Object3D();
 }
 updateTraffic(dt){ const o=this.cd; this.carData.forEach((c,i)=>{c.z+=c.v*dt; if(c.z>150)c.z=-10; if(c.z<-10)c.z=150; o.position.set(c.x,.45,c.z); o.updateMatrix(); this.cars.setMatrixAt(i,o.matrix);}); this.cars.instanceMatrix.needsUpdate=true; }
 startTour(){ this.tour={t:0}; $('#tour').textContent='Stop tour'; }
 stopTour(){ if(this.tour){this.tour=null;$('#tour').textContent='Start cinematic tour';} }
 setQuality(q){ const n={1:1024,2:2048,4:4096}[q]||2048; this.sun.shadow.mapSize.set(n,n); if(this.sun.shadow.map){this.sun.shadow.map.dispose();this.sun.shadow.map=null;} this.pr=q===1?1:q===2?1.5:2; this.resize(); }
 setData(s){
  const A=byId(s.ind), F=forecast(A.v), vals=[...A.v,...F.pts], hi=Math.max(...vals.map(Math.abs));
  if(!this.towers.length) vals.forEach((_,i)=>{
   const ghost=i>=YEARS.length, m=new THREE.Mesh(new THREE.BoxGeometry(2.4,1,2.4),new THREE.MeshStandardMaterial({roughness:.4,metalness:.2,transparent:ghost,opacity:ghost?.5:1}));
   m.position.set((i-4)*4.2,0,8); m.castShadow=m.receiveShadow=true; m.userData.i=i; this.scene.add(m); this.towers.push({m,h:.01,t:.01});
  });
  this.towers.forEach((t,i)=>{ const v=vals[i], ghost=i>=YEARS.length; t.m.visible=!ghost||!!s.fc; t.t=Math.max(.3,Math.abs(v)/hi*20);
   const bad=A.good==='up'?v<0:v>thr(A); t.m.material.color.set(ghost?0xf4b73a:bad?0xee5a5f:0x6fd36b);
   t.m.material.emissive.set(i===s.yi?0xf4b73a:0x000000); t.m.material.emissiveIntensity=i===s.yi?.55:0; });
 }
 setTime(tod){
  const a=(tod-.25)*Math.PI*2, e=Math.sin(a), up=clamp(e,0,1), night=clamp(-e*3+.2,0,1), glow=clamp(1-Math.abs(e)*3.2,0,1);
  this.sun.position.set(Math.cos(a)*90,Math.max(e,.04)*90+6,30); this.sun.target.position.set(0,0,0);
  this.sun.intensity=Math.pow(up,.7)*1.9; this.sun.color.copy(mixC(0xff8a3d,0xfff1dc,up*1.4));
  this.hemi.intensity=.12+.5*up; const sky=mixC(mixC(0x070a1a,0x3a2450,glow),0x6fb0e8,up); sky.lerp(new THREE.Color(0xff8b4a),glow*.6);
  this.scene.background=sky; this.scene.fog.color.copy(sky); this.cityMat.emissiveIntensity=night*1.4; this.lotusMat.emissiveIntensity=night*.9;
  this.r.toneMappingExposure=lerp(1.25,1,up);
 }
 resize(){ const w=innerWidth,h=innerHeight; this.r.setPixelRatio(Math.min(devicePixelRatio,this.pr||2)); this.r.setSize(w,h,false); this.cam.aspect=w/h; this.cam.fov=w<h?62:46; this.cam.updateProjectionMatrix(); }
 bindInput(){
  const c=this.canvas; let down=null,moved=0;
  c.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};moved=0;c.setPointerCapture(e.pointerId);this.o.idle=0;this.stopTour();});
  c.addEventListener('pointermove',e=>{
   if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;moved+=Math.abs(dx)+Math.abs(dy);down={x:e.clientX,y:e.clientY};
    this.o.th-=dx*.006;this.o.ph=clamp(this.o.ph-dy*.005,.45,1.45);}
   else this.hover(e);
  });
  c.addEventListener('pointerup',e=>{ if(down&&moved<5){const i=this.pick(e);if(i>=0)this.onPick(i);} down=null; });
  c.addEventListener('wheel',e=>{e.preventDefault();this.o.rad=clamp(this.o.rad*(1+e.deltaY*.001),22,110);},{passive:false});
 }
 pick(e){ this.m.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); this.ray.setFromCamera(this.m,this.cam);
  const h=this.ray.intersectObjects(this.towers.filter(t=>t.m.visible).map(t=>t.m))[0]; return h?h.object.userData.i:-1; }
 hover(e){ const i=this.pick(e); this.canvas.style.cursor=i>=0?'pointer':'grab'; this.onHover(i,e.clientX,e.clientY); }
 frame(dt,t){
  const o=this.o;
  if(this.tour){const T=this.tour;T.t+=dt;const n=KF.length,seg=Math.floor(T.t/6)%n,u=(T.t%6)/6,e=u*u*(3-2*u),a=KF[seg],b=KF[(seg+1)%n];
   o.th=lerp(a.th,b.th,e);o.ph=lerp(a.ph,b.ph,e);o.rad=lerp(a.rad,b.rad,e);o.tgt.y=lerp(a.y,b.y,e);o.idle=0;}
  else if(!reduced){o.idle+=dt; if(o.idle>6)o.th+=dt*.05;}
  this.cam.position.set(o.tgt.x+o.rad*Math.sin(o.ph)*Math.sin(o.th),o.tgt.y+o.rad*Math.cos(o.ph),o.tgt.z+o.rad*Math.sin(o.ph)*Math.cos(o.th)); this.cam.lookAt(o.tgt);
  this.towers.forEach(k=>{k.h+=(k.t-k.h)*Math.min(1,dt*5);k.m.scale.y=k.h;k.m.position.y=k.h/2;});
  this.beacon.visible=Math.sin(t*3)>0; this.updateTraffic(dt); this.r.render(this.scene,this.cam);
 }
}

/* ---------- 2D views ---------- */
function renderChart(s){
 const A=byId(s.ind), B=s.cmp?byId(s.cmp):null, W=320,H=150,p={l:34,r:12,t:12,b:22}, F=s.fc?forecast(A.v):null, n=YEARS.length+(F?2:0);
 const band=F?F.sd*1.5:0, all=F?[...A.v,...F.pts.map(x=>x+band),...F.pts.map(x=>x-band)]:A.v, [lo,hi]=ext(all);
 const X=i=>p.l+i*(W-p.l-p.r)/(n-1), Y=v=>p.t+(1-(v-lo)/((hi-lo)||1))*(H-p.t-p.b);
 const line=(arr,off,col,dash)=>`<polyline fill="none" stroke="${col}" stroke-width="2.2" ${dash?`stroke-dasharray="${dash}"`:''} points="${arr.map((v,i)=>X(i+off)+','+Y(v)).join(' ')}"/>`;
 const yrs=[...YEARS,...(F?[2025,2026]:[])];
 let h=`<text x="2" y="${p.t+4}" fill="#a6adbb" font-size="9">${hi.toFixed(1)}</text><text x="2" y="${H-p.b}" fill="#a6adbb" font-size="9">${lo.toFixed(1)}</text>`;
 h+=yrs.map((y,i)=>`<text x="${X(i)}" y="${H-6}" fill="#a6adbb" font-size="9" text-anchor="middle">${String(y).slice(2)}</text>`).join('');
 if(s.yi<YEARS.length)h+=`<line x1="${X(s.yi)}" x2="${X(s.yi)}" y1="${p.t}" y2="${H-p.b}" stroke="#f4b73a" stroke-dasharray="3 3"/>`;
 if(F){const l=YEARS.length-1,[a,b]=F.pts; h+=`<polygon fill="rgba(244,183,58,.18)" points="${X(l)},${Y(A.v[l])} ${X(l+1)},${Y(a+band)} ${X(l+2)},${Y(b+band)} ${X(l+2)},${Y(b-band)} ${X(l+1)},${Y(a-band)}"/>`+line([A.v[l],a,b],l,'#f4b73a','4 3');}
 if(B){const[bl,bh]=ext(B.v); h+=line(B.v.map(v=>lo+(v-bl)/((bh-bl)||1)*(hi-lo)),0,'#59b7ff');}
 h+=line(A.v,0,'#f4b73a')+`<circle cx="${X(s.yi)}" cy="${Y(A.v[s.yi])}" r="4.5" fill="#f4b73a"/>`;
 $('#chart').innerHTML=h;
 $('#legend').innerHTML=`<span><i style="background:#f4b73a"></i>${A.label}</span>`+(B?`<span><i style="background:#59b7ff"></i>${B.label}</span>`:'')+(F?'<span>Dashed: trend forecast</span>':'');
}
function renderKpi(s){
 const A=byId(s.ind), v=A.v[s.yi], pv=A.v[s.yi-1]; $('#val').textContent=fmt(v,A.unit);
 const y=$('#yoy'); if(pv===undefined){y.textContent='';return;}
 const d=v-pv, good=(d>=0)===(A.good==='up'); y.className=good?'up':'down'; y.textContent=`${d>=0?'\u25B2':'\u25BC'} ${Math.abs(d).toFixed(1)} vs ${YEARS[s.yi-1]}`;
}
function renderBrief(s){
 const A=byId(s.ind), [lo,hi]=ext(A.v); let t=`Peak in ${YEARS[A.v.indexOf(hi)]} at ${fmt(hi,A.unit)}; low in ${YEARS[A.v.indexOf(lo)]} at ${fmt(lo,A.unit)}.`;
 if(s.cmp){const B=byId(s.cmp), r=pearson(A.v,B.v), k=Math.abs(r);t+=` Correlation with ${B.label.toLowerCase()}: r = ${r.toFixed(2)} (${k<.3?'weak':k<.6?'moderate':'strong'}, ${YEARS.length} points only).`;}
 if(s.fc){const F=forecast(A.v);t+=` A straight-line trend on the last 5 years gives ${fmt(F.pts[0],A.unit)} for 2025 and ${fmt(F.pts[1],A.unit)} for 2026 (band \u00B1${(F.sd*1.5).toFixed(1)}). A trend line is not a prediction.`;}
 $('#brief').textContent=t;
}
function exportCsv(){
 const rows=[['year',...IND.map(i=>i.label)],...YEARS.map((y,k)=>[y,...IND.map(i=>i.v[k])])];
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'})); a.download='sri-lanka-indicators-demo.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- Wire-up ---------- */
$('#note').textContent='Illustrative demo data. Replace with verified CBSL / DCS figures before citing.';
$('#ind').innerHTML=IND.map(i=>`<option value="${i.id}">${i.label}</option>`).join('');
$('#cmp').innerHTML='<option value="">None</option>'+IND.map(i=>`<option value="${i.id}">${i.label}</option>`).join('');
$('#years').innerHTML=YEARS.map((y,i)=>`<button type="button" data-i="${i}">${y}</button>`).join('');
$('#ind').onchange=e=>store.set({ind:e.target.value}); $('#cmp').onchange=e=>store.set({cmp:e.target.value});
$('#years').onclick=e=>{const b=e.target.closest('button'); if(b)store.set({yi:+b.dataset.i});};
$('#tod').oninput=e=>store.set({tod:+e.target.value}); $('#csv').onclick=exportCsv;
$('#fc').onchange=e=>store.set({fc:e.target.checked}); $('#q').onchange=e=>world.ok&&world.setQuality(+e.target.value);
$('#tour').onclick=()=>{ if(!world.ok)return; world.tour?world.stopTour():world.startTour(); };
addEventListener('keydown',e=>{ if(e.target.matches('select,input'))return; const s=store.get();
 if(e.key==='ArrowRight')store.set({yi:Math.min(YEARS.length-1,s.yi+1)}); if(e.key==='ArrowLeft')store.set({yi:Math.max(0,s.yi-1)}); });

const world=new World($('#gl'),i=>{if(i<YEARS.length)store.set({yi:i});},(i,x,y)=>{
 const tip=$('#tip'); if(i<0){tip.hidden=true;return;} const A=byId(store.get().ind);
 tip.hidden=false; tip.style.left=x+'px'; tip.style.top=y+'px'; tip.textContent=i<YEARS.length?`${YEARS[i]}: ${fmt(A.v[i],A.unit)}`:`${2025+i-YEARS.length} forecast: ${fmt(forecast(A.v).pts[i-YEARS.length],A.unit)}`; });
if(!world.ok) document.body.classList.add('nogl');

store.sub(s=>{
 $('#ind').value=s.ind; $('#cmp').value=s.cmp; $('#tod').value=s.tod; $('#fc').checked=!!s.fc;
 document.querySelectorAll('#years button').forEach((b,i)=>b.setAttribute('aria-pressed',i===s.yi));
 renderKpi(s); renderChart(s); renderBrief(s); if(world.ok){world.setData(s);world.setTime(s.tod);}
});

if(world.ok){ let last=performance.now(), run=true;
 document.addEventListener('visibilitychange',()=>{run=!document.hidden; last=performance.now(); if(run)loop(last);});
 function loop(now){ if(!run)return; const dt=Math.min(.05,(now-last)/1000); last=now; world.frame(dt,now/1000); perf(dt); requestAnimationFrame(loop); }
 requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
